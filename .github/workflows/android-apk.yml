
name: Khahish Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Khahish project
        run: |
          mkdir extracted
          unzip -q KhahishAndroid-Starter-v2.zip -d extracted

          SETTINGS=$(find extracted -name "settings.gradle.kts" -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "Gradle project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Place Firebase config
        run: |
          cp google-services.json "$PROJECT_DIR/app/google-services.json"

      - name: Configure Firebase and Kotlin
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])
          root = project / "build.gradle.kts"
          app = project / "app" / "build.gradle.kts"

          s = root.read_text()

          s = re.sub(
              r'(id\("org\.jetbrains\.kotlin\.(?:android|plugin\.compose)"\) version ")[^"]+(" apply false)',
              r'\g<1>2.4.21\g<2>',
              s
          )

          if 'id("com.google.gms.google-services")' not in s:
              s = s.replace(
                  'id("org.jetbrains.kotlin.plugin.compose") version "2.4.21" apply false',
                  'id("org.jetbrains.kotlin.plugin.compose") version "2.4.21" apply false\n'
                  '    id("com.google.gms.google-services") version "4.5.0" apply false'
              )

          root.write_text(s)

          s = app.read_text()

          if 'id("com.google.gms.google-services")' not in s:
              s = s.replace(
                  'id("org.jetbrains.kotlin.plugin.compose")',
                  'id("org.jetbrains.kotlin.plugin.compose")\n'
                  '    id("com.google.gms.google-services")'
              )

          if "firebase-bom" not in s:
              s = s.replace(
                  "dependencies {\n",
                  'dependencies {\n'
                  '    implementation(platform("com.google.firebase:firebase-bom:35.1.0"))\n'
                  '    implementation("com.google.firebase:firebase-auth")\n'
                  '    implementation("com.google.firebase:firebase-firestore")\n',
                  1
              )

          app.write_text(s)

          print("Firebase and Kotlin configuration updated")
          PY

      - name: Force Java 17
        run: |
          cd "$PROJECT_DIR"

          find . -name "build.gradle*" | while read file; do
            sed -i 's/VERSION_1_8/VERSION_17/g' "$file"
          done

      - name: Build Khahish APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload Khahish APK
        uses: actions/upload-artifact@v4
        with:
          name: Khahish-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
