
name: Khahish Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Extract Khahish project
        run: |
          mkdir extracted
          unzip -q KhahishAndroid-Starter-v2.zip -d extracted

          SETTINGS=$(find extracted -name "settings.gradle.kts" -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "Gradle project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"

      - name: Place Firebase config
        run: |
          cp google-services.json "$PROJECT_DIR/app/google-services.json"

      - name: Configure Firebase and Kotlin
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])
          root = project / "build.gradle.kts"
          app = project / "app" / "build.gradle.kts"

          # Update Kotlin plugin versions
          s = root.read_text()

          for plugin in [
              "org.jetbrains.kotlin.android",
              "org.jetbrains.kotlin.plugin.compose"
          ]:
              pattern = (
                  r'(id\("' + re.escape(plugin) +
                  r'"\) version ")[^"]+(" apply false)'
              )
              s, count = re.subn(
                  pattern,
                  r'\g<1>2.4.21\g<2>',
                  s
              )
              if count != 1:
                  raise Exception("Kotlin plugin not found: " + plugin)

          # Add Google Services plugin
          if 'id("com.google.gms.google-services")' not in s:
              anchor = (
                  '    id("org.jetbrains.kotlin.plugin.compose") '
                  'version "2.4.21" apply false'
              )
              if anchor not in s:
                  raise Exception("Compose plugin line not found")
              s = s.replace(
                  anchor,
                  anchor + '\n'
                  '    id("com.google.gms.google-services") '
                  'version "4.5.0" apply false'
              )

          root.write_text(s)

          # Configure app module
          s = app.read_text()

          # Apply Google Services plugin
          if 'id("com.google.gms.google-services")' not in s:
              anchor = '    id("org.jetbrains.kotlin.plugin.compose")'
              if anchor not in s:
                  raise Exception("App Compose plugin not found")
              s = s.replace(
                  anchor,
                  anchor + '\n'
                  '    id("com.google.gms.google-services")'
              )

          # Set Java target to 17
          if "compileOptions {" not in s:
              anchor = "    buildFeatures { compose = true }"
              if anchor not in s:
                  raise Exception("Build features block not found")
              s = s.replace(
                  anchor,
                  '    compileOptions {\n'
                  '        sourceCompatibility = JavaVersion.VERSION_17\n'
                  '        targetCompatibility = JavaVersion.VERSION_17\n'
                  '    }\n'
                  + anchor
              )
          else:
              s = re.sub(
                  r'sourceCompatibility\s*=\s*JavaVersion\.VERSION_\w+',
                  'sourceCompatibility = JavaVersion.VERSION_17',
                  s
              )
              s = re.sub(
                  r'targetCompatibility\s*=\s*JavaVersion\.VERSION_\w+',
                  'targetCompatibility = JavaVersion.VERSION_17',
                  s
              )

          # Set Kotlin JVM target to 17
          if "compilerOptions {" not in s:
              anchor = "dependencies {"
              if anchor not in s:
                  raise Exception("Dependencies block not found")
              s = s.replace(
                  anchor,
                  'kotlin {\n'
                  '    compilerOptions {\n'
                  '        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget("17")\n'
                  '    }\n'
                  '}\n\n'
                  + anchor,
                  1
              )

          # Add Firebase dependencies
          if "firebase-bom" not in s:
              s = s.replace(
                  "dependencies {\n",
                  'dependencies {\n'
                  '    implementation(platform("com.google.firebase:firebase-bom:35.1.0"))\n'
                  '    implementation("com.google.firebase:firebase-auth")\n'
                  '    implementation("com.google.firebase:firebase-firestore")\n',
                  1
              )

          app.write_text(s)

          print("Firebase configured")
          print("Kotlin version: 2.4.21")
          print("Java target: 17")
          print("Kotlin JVM target: 17")
          PY

      - name: Build Khahish APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload Khahish APK
        uses: actions/upload-artifact@v4
        with:
          name: Khahish-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
