
name: Khahish Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Extract Khahish project
        run: |
          mkdir extracted
          unzip -q KhahishAndroid-Starter-v2.zip -d extracted

          SETTINGS=$(find extracted -name "settings.gradle.kts" -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "Gradle project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"

      - name: Copy updated MainActivity
        run: |
          TARGET="$PROJECT_DIR/app/src/main/java/com/khahish/app"
          mkdir -p "$TARGET"
          cp MainActivity.kt "$TARGET/MainActivity.kt"
          echo "Updated MainActivity copied successfully"

      - name: Create Khahish App Icon
        run: |
          python3 -m pip install pillow

          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          import os
          import re

          project = Path(os.environ["PROJECT_DIR"])
          logo = Path("khahish_logo.png")

          if not logo.exists():
              raise Exception("khahish_logo.png not found")

          image = Image.open(logo).convert("RGBA")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          for folder, size in sizes.items():
              output = project / "app/src/main/res" / folder
              output.mkdir(parents=True, exist_ok=True)

              icon = ImageOps.fit(
                  image,
                  (size, size),
                  method=Image.Resampling.LANCZOS
              )

              icon.save(output / "khahish_launcher.png")
              icon.save(output / "khahish_launcher_round.png")

          manifest = project / "app/src/main/AndroidManifest.xml"
          content = manifest.read_text()

          match = re.search(r'<application\b[^>]*>', content)

          if not match:
              raise Exception("Application tag not found")

          tag = match.group(0)

          for attribute, value in [
              ("android:icon", "@mipmap/khahish_launcher"),
              ("android:roundIcon", "@mipmap/khahish_launcher_round")
          ]:
              pattern = rf'{attribute}="[^"]*"'

              if re.search(pattern, tag):
                  tag = re.sub(pattern, f'{attribute}="{value}"', tag)
              else:
                  tag = tag[:-1] + f' {attribute}="{value}">'

          content = content[:match.start()] + tag + content[match.end():]

          if "android.permission.INTERNET" not in content:
              content = content.replace(
                  '<application',
                  '<uses-permission android:name="android.permission.INTERNET" />\n    <application',
                  1
              )

          manifest.write_text(content)
          print("Icon and Internet permission configured")
          PY

      - name: Place Firebase config
        run: |
          cp google-services.json "$PROJECT_DIR/app/google-services.json"

      - name: Configure Firebase Gradle
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])
          root = project / "build.gradle.kts"
          app = project / "app" / "build.gradle.kts"

          root_text = root.read_text()
          app_text = app.read_text()

          google_plugin = '    id("com.google.gms.google-services") version "4.4.2" apply false'

          if "com.google.gms.google-services" not in root_text:
              root_text = root_text.replace(
                  '    id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false',
                  '    id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false\n' + google_plugin
              )

          root.write_text(root_text)

          if 'id("com.google.gms.google-services")' not in app_text:
              app_text = app_text.replace(
                  '    id("org.jetbrains.kotlin.plugin.compose")',
                  '    id("org.jetbrains.kotlin.plugin.compose")\n    id("com.google.gms.google-services")',
                  1
              )

          if "compileOptions {" not in app_text:
              app_text = app_text.replace(
                  "    buildFeatures { compose = true }",
                  """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              buildFeatures { compose = true }"""
              )

          if "compilerOptions {" not in app_text:
              app_text = app_text.replace(
                  "dependencies {",
                  """kotlin {
              compilerOptions {
                  jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget("17")
              }
          }

          dependencies {""",
                  1
              )

          if "firebase-bom" not in app_text:
              app_text = app_text.replace(
                  "dependencies {",
                  """dependencies {
              implementation(platform("com.google.firebase:firebase-bom:35.1.0"))
              implementation("com.google.firebase:firebase-auth")
              implementation("com.google.firebase:firebase-firestore")""",
                  1
              )

          app.write_text(app_text)
          print("Firebase Gradle configuration completed")
          PY

      - name: Build Khahish APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload Khahish APK
        uses: actions/upload-artifact@v4
        with:
          name: Khahish-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
