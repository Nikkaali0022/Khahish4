name: Khahish Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Khahish project
        run: |
          mkdir extracted
          unzip KhahishAndroid-Starter-v2.zip -d extracted
          SETTINGS=$(find extracted -name settings.gradle.kts -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Java 17 Compatibility
        run: |
          find "$PROJECT_DIR" -name "build.gradle*" | while read file; do
            sed -i 's/VERSION_1_8/VERSION_17/g' "$file"
            sed -i 's/"1.8"/"17"/g' "I$file" 2>/dev/null || true
            sed -i "s/'1.8'/'17'/g" "$file"
          done

      - name: Build Khahish APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload Khahish APK
        uses: actions/upload-artifact@v4
        with:
          name: Khahish-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
